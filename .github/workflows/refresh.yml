name: weekly-data-refresh

on:
  schedule:
    - cron: "0 5 * * 1"   # every Monday at 05:00 UTC
  workflow_dispatch:        # manual run button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull fresh TED data
        env:
          LICENCE_SECRET: ${{ secrets.LICENCE_SECRET }}
        run: python -m pipeline.refresh_from_api

      - name: Re-run detection
        env:
          LICENCE_SECRET: ${{ secrets.LICENCE_SECRET }}
        run: python -c "from pipeline.schema import get_connection; from pipeline.detect import run_all_rules; run_all_rules(get_connection())"

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f procurement.db
          git diff --staged --quiet || git commit -m "Weekly automated data refresh"
          git push
